<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#grad1)" opacity="0.15"/>
  
  <!-- Central node -->
  <circle cx="64" cy="64" r="14" fill="url(#grad1)" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="7" fill="#fff" opacity="0.9"/>
  
  <!-- Connection lines -->
  <line x1="64" y1="64" x2="30" y2="30" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="98" y2="30" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="30" y2="98" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="98" y2="98" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="64" y2="20" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="64" y1="64" x2="64" y2="108" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Surrounding nodes -->
  <circle cx="30" cy="30" r="8" fill="url(#grad1)" opacity="0.9"/>
  <circle cx="98" cy="30" r="8" fill="url(#grad1)" opacity="0.9"/>
  <circle cx="30" cy="98" r="8" fill="url(#grad1)" opacity="0.9"/>
  <circle cx="98" cy="98" r="8" fill="url(#grad1)" opacity="0.9"/>
  <circle cx="64" cy="20" r="5" fill="url(#grad2)" opacity="0.7"/>
  <circle cx="64" cy="108" r="5" fill="url(#grad2)" opacity="0.7"/>
  
  <!-- Inner dots -->
  <circle cx="30" cy="30" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="98" cy="30" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="30" cy="98" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="98" cy="98" r="3" fill="#fff" opacity="0.8"/>
</svg>
