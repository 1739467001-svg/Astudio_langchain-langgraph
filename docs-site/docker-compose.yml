version: "3.8"

services:
  learning-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langchain-learning
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
